name: AutoShield — QA Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Opt into Node.js 24 early — Node.js 20 actions deprecated from June 2nd 2026
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── UI + BDD tests — runs on all three browsers in parallel ───────────────
  ui-bdd-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run UI and BDD tests
        run: |
          pytest tests/ bdd/ \
            --browser=${{ matrix.browser }} \
            --html=reports/report_ui_${{ matrix.browser }}.html \
            --self-contained-html \
            -v
        continue-on-error: true

      - name: Upload UI reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.browser }}
          path: reports/

      - name: Deploy UI reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        # continue-on-error prevents parallel push conflicts from failing the job
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/
          destination_dir: ${{ matrix.browser }}
          keep_files: true

  # ── API tests — runs once after UI jobs, avoids parallel rate limiting ─────
  api-tests:
    runs-on: ubuntu-latest
    needs: ui-bdd-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run API tests
        run: |
          pytest api_tests/ \
            --html=reports/report_api.html \
            --self-contained-html \
            -v
        continue-on-error: true

      - name: Upload API reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-api
          path: reports/

      - name: Deploy API reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/
          destination_dir: api
          keep_files: true

          
      - name: Prepare root index for GitHub Pages
        run: |
          mkdir -p deploy_root
          cp reports/index.html deploy_root/index.html

      - name: Deploy index page to GitHub Pages root
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy_root/
          keep_files: true